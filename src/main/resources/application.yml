spring:
  application:
    name: redis-cache-spring-demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cache_demo}
    username: ${DB_USERNAME:cache_user}
    password: ${DB_PASSWORD:cache_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8080}

app:
  cache:
    product-ttl-seconds: ${PRODUCT_CACHE_TTL_SECONDS:30}
  demo:
    database-delay-ms: ${DATABASE_DELAY_MS:120}
